# Serves the static client and acts as the API gateway for the game service.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream game_service {
  server game:4000;
}

upstream accounts_service {
  server accounts:4002;
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;
  index index.html;

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"web"}';
  }

  location /ws {
    proxy_pass http://game_service;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }

  location /api/game/ {
    proxy_pass http://game_service/;
  }

  # the accounts service's /internal/ routes are for the game service only
  location /api/accounts/internal/ {
    return 404;
  }

  location /api/accounts/ {
    proxy_pass http://accounts_service/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 8k;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
