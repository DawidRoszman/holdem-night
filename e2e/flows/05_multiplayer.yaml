url: ${APP_URL}
name: Multiplayer - join a table opened by another player over WebSockets
tags:
  - multiplayer
env:
  APP_URL: http://localhost:8090
  PLAYER_NAME: Browser Bea
---
# requires e2e/remote-player.js to be running (run.sh starts it)
- runFlow:
    file: common/login.yaml
    env:
      PLAYER_NAME: ${PLAYER_NAME}
- extendedWaitUntil:
    visible: "Remote Table"
    timeout: 10000
- assertVisible: "1/6 players.*"
- tapOn:
    id: "join-remote-table"
- assertVisible: "Remote Rita"
- assertVisible: "Browser Bea"
- extendedWaitUntil:
    visible: ".*Hand #\\d+"
    timeout: 10000
- runFlow: common/play_hand.yaml
- tapOn: "Leave table"
- assertVisible: "Welcome, ${PLAYER_NAME}"
# the remote player's table is still open in the lobby
- assertVisible: "Remote Table"
# the game in detail: newest first in the profile's history
- tapOn:
    id: "profile-button"
- extendedWaitUntil:
    visible: "Playing since .*"
    timeout: 10000
- scrollUntilVisible:
    element: "Remote Table"
    direction: DOWN
- tapOn: "Remote Table"
- extendedWaitUntil:
    visible: "Players at this table"
    timeout: 10000
- assertVisible: "${PLAYER_NAME} \\(you\\)"
- assertVisible: "Settle up"
# Rita is still at her table, so her result isn't known yet
- assertVisible: "Nothing to settle yet: Remote Rita is still at the table."
- scrollUntilVisible:
    element: "Hands"
    direction: DOWN
- assertVisible: ".*(You folded|You showed|won \\d+).*"
- scrollUntilVisible:
    element:
      id: "game-back"
    direction: UP
- tapOn:
    id: "game-back"
- extendedWaitUntil:
    visible: "Playing since .*"
    timeout: 10000
