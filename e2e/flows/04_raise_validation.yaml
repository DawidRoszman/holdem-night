url: ${APP_URL}
name: Gameplay - raising, and server-side rejection of an illegal raise
tags:
  - gameplay
env:
  APP_URL: http://localhost:8090
  PLAYER_NAME: Raising Rae
---
- runFlow:
    file: common/login.yaml
    env:
      PLAYER_NAME: ${PLAYER_NAME}
- tapOn:
    id: "table-name-input"
- inputText: "Raise Room"
# bots only sit at practice tables
- tapOn: "Practice vs bots"
- tapOn: "Create table"
- tapOn: "Add bot"
# the host deals the first hand
- tapOn: "Start game"
- extendedWaitUntil:
    visible: "Your turn"
    timeout: 15000
# a raise below the minimum (to 40) is rejected by the game service
- tapOn:
    id: "raise-input"
- eraseText: 10
- inputText: "25"
- tapOn:
    id: "raise-button"
- assertVisible: "Minimum raise is to 40"
# a legal raise is accepted and the bot calls it
- tapOn:
    id: "raise-input"
- eraseText: 10
- inputText: "100"
- tapOn:
    id: "raise-button"
- extendedWaitUntil:
    visible: "Pot: 200"
    timeout: 5000
# the hand log is below the table: scroll down to it, then back up to play on
- scrollUntilVisible:
    element: ".*Raising Rae raises to 100.*"
    direction: DOWN
    timeout: 5000
- assertVisible: ".*Ada \\(bot\\) calls 80.*"
- scrollUntilVisible:
    element:
      id: "pot"
    direction: UP
    centerElement: true
- runFlow: common/play_hand.yaml
# back to the top of the page, clear of the sticky header (see 07_bust_or_win)
- scrollUntilVisible:
    element: "Leave table"
    direction: UP
    centerElement: true
- tapOn: "Leave table"
