url: ${APP_URL}
name: Game over - going all-in until someone busts, then rebuy or win the table
tags:
  - gameplay
env:
  APP_URL: http://localhost:8090
  PLAYER_NAME: All-in Alex
---
- runFlow:
    file: common/login.yaml
    env:
      PLAYER_NAME: ${PLAYER_NAME}
- tapOn:
    id: "table-name-input"
- inputText: "Showdown Saloon"
# bots only sit at practice tables
- tapOn: "Practice vs bots"
- tapOn: "Create table"
- tapOn: "Add bot"
# the host deals the first hand
- tapOn: "Start game"
# heads-up all-in against a bot that always calls: one of us busts (a split pot just deals again)
- repeat:
    times: 10
    while:
      notVisible: "You won the table!|You.re out of chips"
    commands:
      - extendedWaitUntil:
          visible: "Your turn|You won the table!|You.re out of chips"
          timeout: 20000
      - runFlow:
          when:
            visible:
              id: "allin-button"
          commands:
            - tapOn:
                id: "allin-button"
# the result is shown on the table either way
- assertVisible: ".* wins 2000.*|You win 2000.*|You won the table!"
# --- we busted: a dialog explains it and offers a rebuy
- runFlow:
    when:
      visible: "You.re out of chips"
    commands:
      - assertVisible: "Ada \\(bot\\) took your last chips.*"
      - extendedWaitUntil:
          visible:
            id: "rebuy-button"
          timeout: 5000
      - assertVisible: "Rebuy 1000 chips"
      - tapOn:
          id: "rebuy-button"
      # the hand log is below the table; after a few hands the line is out of sight
      - scrollUntilVisible:
          element: ".*All-in Alex rebuys for 1000.*"
          direction: DOWN
          timeout: 5000
      - assertNotVisible: "You.re out of chips"
      # centred, which scrolls to the top of the page: a button left under the sticky
      # header still counts as visible, but a tap on it would land on Log out
      - scrollUntilVisible:
          element: "Leave table"
          direction: UP
          centerElement: true
# --- the bot busted: we are told we won the table
- runFlow:
    when:
      visible: "You won the table!"
    commands:
      # in the result banner, after why the last hand was won
      - assertVisible: ".*Ada \\(bot\\) is out of chips.*"
      - assertVisible: "\\+1000"
- tapOn: "Leave table"
- assertVisible: "Welcome, ${PLAYER_NAME}"
